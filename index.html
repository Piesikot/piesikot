/* 🤖 Unified arrow behavior: this matches the nav-lang approach using transform rotation instead of mixing rotate + inline JS. */
.nav-arrow {
    width: 3em;
    margin-bottom: -9px;
    transition: transform 0.7s ease, rotate 0.7s ease;
}

#nav-cats .nav-arrow {
    rotate: 90deg;
    /* transform-origin: center; */
}

#nav-projects .nav-arrow {
    rotate: 270deg;
    /* transform-origin: center; */
}

#nav-cats:hover .nav-arrow {
    transform: rotate(0.8turn);
}

#nav-projects:hover .nav-arrow {
    transform: rotate(-0.8turn);
}

#lang-arrow-left{
    rotate: 270deg;
    /* transform-origin: center; */
}
#lang-arrow-right{
    rotate: 90deg;
    /* transform-origin: center; */
}

.lang-arrow{
    width: 3em; 
    margin-bottom: -9px;
    transition: transform 0.7s ease, rotate 0.7s ease;
    /* transform-origin: center; */
}

#nav-lang:hover #lang-arrow-left {
    transform: rotate(-0.8turn);
}

#nav-lang:hover #lang-arrow-right {
    transform: rotate(0.8turn);
}

/* Nie wiem, czemu nie jestem w stanie tego ustawić na buttonie, i musiałem zrobić nowego diva. */
#cat-dropbtn-underline{
  position: absolute;
  display: block;
  width: 100%;
  height: 2px;
  bottom: 0;
  left: 0;
  background-color: #000;
  transform: scaleX(1);
  transform-origin: top left;
  transition: transform 0.3s ease;
}

#nav-cats:hover #cat-dropbtn-underline {
    transform: scaleX(0);
  transform-origin: top left;
}

#projects-dropbtn-underline{
  position: absolute;
  display: block;
  width: 100%;
  height: 2px;
  bottom: 0;
  left: 0;
  background-color: #000;
  transform: scaleX(1);
  transform-origin: top left;
  transition: transform 0.3s ease;
}

#nav-projects:hover #projects-dropbtn-underline {
    transform: scaleX(0);
  transform-origin: top right;
} 

.project-underline{
display: inline-block;
  position: relative;
  color: black;
}

.cat-underline, .project-underline {
  display: inline-block;
  position: relative;
  color: black;
}

.cat-underline:after, .project-underline::after {
  content: '';
  position: absolute;
  width: 100%;
  transform: scaleX(0);
  height: 2px;
  bottom: 0;
  left: 0;
  background-color: black;
  transform-origin: bottom ;
  transition: transform 0.7s ease;
}

.cat-underline:hover:after, .project-underline:hover::after {
  transform: scaleX(1);
  transform-origin: bottom;
}

.github-link {
    text-decoration: none;
    color: black;
}

/* 🤖 Styling for header__github-name link: black color, animated underline on hover (consistent with nav). */

    position: relative;
}

.header__github-name a::after {
    content: '';

    bottom: 0;
    left: 0;

    height: 2px;
    background-color: black;
    transform: scaleX(0);
    transform-origin: bottom;
    transition: transform 0.7s ease;
}

.header__github-name a:hover::after {
    transform: scaleX(1);
    transform-origin: bottom;
}
